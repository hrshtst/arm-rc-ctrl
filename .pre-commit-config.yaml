# Lightweight hooks only: file hygiene plus Ruff lint/format. Type checking,
# tests, and the C++ build run through nox (`uv run nox`) and CI.
exclude: '^(third_party/|tests/fixtures/quality/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=200'] # test fixtures must stay tiny; payloads never enter Git
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-executables-have-shebangs
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5 # keep equal to the ruff version locked in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
