# Task 1-a ESN model configuration, version 1 (docs/TASKS.md M2-018): the development anchor
# configs/models/esn_task_1a.toml with the input scales selected by the input-scale pilot
# docs/experiments/task_1a/input_scale_pilot.json (q 0.3 rad, dq 16 rad/s: the cell with the
# highest feasible fraction among cells whose grid neighbours are all feasible, ties broken by
# the lowest median movement RMSE; 24 of 25 cells were feasible with both frozen trackers).
# The reservoir and readout settings remain hand-picked development values; M3 tunes them.
# tests/regression/test_model_config_lock.py keeps this file consistent with the pilot.
name = "esn-task-1a-v1"

[esn.reservoir]
n_neurons = 200
spectral_radius = 0.9
sparsity = 0.9
leak_rate = 0.3
input_scaling = 0.5
seed = 31

[esn.readout]
alpha = 1e-2
solver = "cholesky"

[input_transform]
policy = "fixed_scale"
q_scale = 0.3
dq_scale = 16.0
