# Recorder session settings of the manual-demonstration protocol, revised after the first practice
# pilot (docs/experiments/task_1a_manual_demonstration/plan.md sections 2.1 and 10, clarifications
# I7 and I13): the options of configs/recording/task_1a_manual_v1.toml plus the acquisition rate,
# which the launcher takes from this file instead of deriving it from the task's training grid.
# The task configuration (configs/tasks/task_1a_manual_v2.toml) supplies the robot, the reset
# posture, the target, the 0.01 s training grid, and the acquisition rules the rate must match.
protocol = "task_1a_manual_v1"
# IK guidance (D1): the tip follows the cursor through inverse kinematics.
mode = "ik"
ik_method = "lm_sugihara"
# Per-take recording timeout (D2); a reached timeout saves the take and keeps the window open.
timeout_s = 30.0
# Visual guidance (D1): the current take's tip trail and the faint saved trails of this session.
show_tip_trail = true
show_past_trails = true
# Base of the numbered take files (reach_001.sklog.npz, reach_002.sklog.npz, ...).
output_name = "reach.sklog.npz"
# Acquisition rate (Hz, I13): a whole 20 ms recorder tick; the training grid stays at 0.01 s.
sample_rate_hz = 50.0
