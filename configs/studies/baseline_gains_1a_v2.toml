# Robustness-constrained tuning protocol v2 for the task 1-a PD baseline (owner decision at the
# M1 review of PR #2; docs/TASKS.md M3-015). Version 1 (baseline_gains_1a.toml) and the gains it
# froze stay immutable development evidence. Differences from v1: development posture offsets in
# eight joint-space directions at 0.04 and 0.08 rad (norms distinct from every confirmatory level),
# development endpoint force pulses at t = 2.5 s in the four diagonal directions (distinct from the
# confirmatory timing and directions), a saturation-headroom bound, and an objective that ranks the
# nominal scenario's movement-window RMSE among trials that are feasible in every development
# scenario. Direct replay only: no RC performance and no confirmatory seed is consulted.
name = "baseline-gains-1a-v2"
scenario = "../tasks/task_1a.toml"
budget = 128
sampler_seed = 20260911

[objective]
# Movement-window joint RMSE (rad) of the nominal (unperturbed) scenario; a trial that terminates
# early, violates a limit, misses a dwell criterion, or exceeds the saturation bound in any
# development scenario receives the penalty instead.
kind = "nominal_move_joint_rmse"
infeasible_penalty = 10.0

[feasibility]
# At most this fraction of control samples may saturate an actuator in any development scenario.
max_saturation_fraction = 0.05

[search.pd]
kp = { low = 1.0, high = 300.0, log = true }
kd = { low = 0.05, high = 60.0, log = true }

[search.computed_torque]
kp = { low = 10.0, high = 900.0, log = true }
kd = { low = 2.0, high = 120.0, log = true }

[development]
# Initial-posture offsets (rad): the nominal posture first, then eight unit directions at 0.04 and 0.08 rad.
initial_posture_offsets = [
    [0.0, 0.0],
    [0.04, 0.0],
    [-0.04, 0.0],
    [0.0, 0.04],
    [0.0, -0.04],
    [0.028284271247, 0.028284271247],
    [-0.028284271247, -0.028284271247],
    [0.028284271247, -0.028284271247],
    [-0.028284271247, 0.028284271247],
    [0.08, 0.0],
    [-0.08, 0.0],
    [0.0, 0.08],
    [0.0, -0.08],
    [0.056568542495, 0.056568542495],
    [-0.056568542495, -0.056568542495],
    [0.056568542495, -0.056568542495],
    [-0.056568542495, 0.056568542495],
]
# Endpoint force pulses (N) applied at the nominal posture during the movement.
[[development.force_pulses]]
start_s = 2.5
duration_s = 0.2
magnitude_n = 6.0
direction_deg = 45.0

[[development.force_pulses]]
start_s = 2.5
duration_s = 0.2
magnitude_n = 6.0
direction_deg = 135.0

[[development.force_pulses]]
start_s = 2.5
duration_s = 0.2
magnitude_n = 6.0
direction_deg = 225.0

[[development.force_pulses]]
start_s = 2.5
duration_s = 0.2
magnitude_n = 6.0
direction_deg = 315.0

[[development.force_pulses]]
start_s = 2.5
duration_s = 0.2
magnitude_n = 9.0
direction_deg = 45.0

[[development.force_pulses]]
start_s = 2.5
duration_s = 0.2
magnitude_n = 9.0
direction_deg = 135.0

[[development.force_pulses]]
start_s = 2.5
duration_s = 0.2
magnitude_n = 9.0
direction_deg = 225.0

[[development.force_pulses]]
start_s = 2.5
duration_s = 0.2
magnitude_n = 9.0
direction_deg = 315.0
