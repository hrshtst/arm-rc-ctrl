# ESN hyperparameter search protocol v2 for task 1-a (docs/PLAN.md section 10; docs/TASKS.md M3-016).
# A protocol correction and stability study after the M3 review of v1 (configs/studies/esn_search_1a.toml,
# which stays immutable with its report and recipe v3): v1 found a single feasible trial of 120, pruned ten
# trials before every constraint was evaluated, and stated its random start-up count without the queued
# comparison points. Changes: no pruner (a trial costs under a second; evaluation still stops at the first
# infeasible scenario), a budget of 1000, the start-up count stated inclusive of the five queued points
# (5 + 100 genuinely random draws before TPE modelling), continuous bounds refined around v1's selected
# trial 13 where v1 sat at a bound (leak rate and input scaling extended downwards, spectral radius,
# reservoir size, and estimator cutoffs narrowed), the reservoir seed kept uniform over its full range
# (numerical proximity of seeds is not a region), and v1's selection queued as a comparison point next to
# the four anchors. Development scenarios, objective, feasibility bound, base model, and tracker are
# unchanged from v1. Development only: no confirmatory seed, level, timing, or direction is used.
name = "esn-search-1a-v2"
scenario = "../tasks/task_1a.toml"
model = "../models/esn_task_1a_v2.toml"
tracker = "pd_v2"
budget = 1000
max_dt_ratio = 3.0

[sampler]
# Study seed: distinct from every confirmatory seed (20260901..20260905), the gain-study seeds
# (20260830, 20260911), and search v1 (20260921). Optuna counts every completed trial, the five queued
# comparison points included, towards n_startup_trials: 100 genuinely random draws precede TPE.
kind = "tpe"
seed = 20260922
n_startup_trials = 105

[pruner]
# No pruning: every trial is evaluated until it is feasible or genuinely infeasible.
kind = "none"

[objective]
kind = "median_move_joint_rmse"
infeasible_penalty = 10.0

[feasibility]
max_saturation_fraction = 0.05

[search]
n_neurons = { low = 100, high = 400, step = 50 }
spectral_radius = { low = 0.8, high = 1.3 }
sparsity = { low = 0.5, high = 0.98 }
leak_rate = { low = 0.01, high = 0.3, log = true }
input_scaling = { low = 0.02, high = 0.5, log = true }
seed = { low = 1, high = 1000 }
alpha = { low = 1e-3, high = 1.0, log = true }
velocity_cutoff_hz = { low = 5.0, high = 30.0, log = true }
acceleration_cutoff_hz = { low = 5.0, high = 30.0, log = true }

# Comparison points: the development anchor (configs/models/esn_task_1a_v2.toml with the nominal
# estimator cutoffs) at alpha 1e-2 (the M2 value) and 3e-2, 1e-1, 3e-1, plus v1's selected trial 13.
[[comparison]]
label = "anchor-alpha-1e-2"
point = { n_neurons = 200, spectral_radius = 0.9, sparsity = 0.9, leak_rate = 0.3, input_scaling = 0.5, seed = 31, alpha = 1e-2, velocity_cutoff_hz = 20.0, acceleration_cutoff_hz = 20.0 }

[[comparison]]
label = "anchor-alpha-3e-2"
point = { n_neurons = 200, spectral_radius = 0.9, sparsity = 0.9, leak_rate = 0.3, input_scaling = 0.5, seed = 31, alpha = 3e-2, velocity_cutoff_hz = 20.0, acceleration_cutoff_hz = 20.0 }

[[comparison]]
label = "anchor-alpha-1e-1"
point = { n_neurons = 200, spectral_radius = 0.9, sparsity = 0.9, leak_rate = 0.3, input_scaling = 0.5, seed = 31, alpha = 1e-1, velocity_cutoff_hz = 20.0, acceleration_cutoff_hz = 20.0 }

[[comparison]]
label = "anchor-alpha-3e-1"
point = { n_neurons = 200, spectral_radius = 0.9, sparsity = 0.9, leak_rate = 0.3, input_scaling = 0.5, seed = 31, alpha = 3e-1, velocity_cutoff_hz = 20.0, acceleration_cutoff_hz = 20.0 }

[[comparison]]
label = "v1-trial-13"
point = { n_neurons = 200, spectral_radius = 1.0919869800080664, sparsity = 0.654914582763362, leak_rate = 0.05869162144717609, input_scaling = 0.13930936236831867, seed = 774, alpha = 0.015036411476169492, velocity_cutoff_hz = 14.175590436732154, acceleration_cutoff_hz = 10.612032951422595 }

[development]
# Initial-posture offsets (rad): the nominal posture first, then eight unit directions at 0.04
# and 0.08 rad (norms distinct from the confirmatory 0.05 and 0.10 rad classes).
initial_posture_offsets = [
    [0.0, 0.0],
    [0.04, 0.0],
    [-0.04, 0.0],
    [0.0, 0.04],
    [0.0, -0.04],
    [0.028284271247, 0.028284271247],
    [-0.028284271247, -0.028284271247],
    [0.028284271247, -0.028284271247],
    [-0.028284271247, 0.028284271247],
    [0.08, 0.0],
    [-0.08, 0.0],
    [0.0, 0.08],
    [0.0, -0.08],
    [0.056568542495, 0.056568542495],
    [-0.056568542495, -0.056568542495],
    [0.056568542495, -0.056568542495],
    [-0.056568542495, 0.056568542495],
]
# Endpoint force pulses (N) at the nominal posture during the movement: 6 N and 9 N at t = 2.5 s
# in the four diagonal directions (the confirmatory pulse is 12 N at t = 2.0 s along the axes).
[[development.force_pulses]]
