# Recovery dataset derivation v1 (M3R-003; docs/experiments/task_1a_state_conditioned_recovery/plan.md
# section 4.1). The full recording (stationary pre-roll included) is smoothed, resampled onto the
# scenario's control period, and differentiated; the derived episode is then cropped at the confirmed
# demonstration motion onset, so the pre-roll serves as filter/derivative context and never becomes
# task content. Task time starts at zero with move/dwell phases only. This file is immutable once
# referenced by a record; changes create recovery_v2.toml.

[smoothing]
method = "butterworth"
cutoff_hz = 5.0
order = 4

[resampling]
interpolation = "linear"

[derivatives]
method = "central"

[normalization]
# Statistics are fitted on the cropped task samples (the training episode).
channels = ["q", "dq", "ddq", "tip", "dtip", "ddtip"]
near_zero = 1e-8

[baseline]
# Robust pre-roll baseline q_pre: per-joint median of the pre-roll samples on the processed grid.
# A larger deviation from the first cropped sample q0_ref marks the record "flagged" for review;
# q0_ref is never replaced.
estimator = "median"
tolerance_rad = 0.05
